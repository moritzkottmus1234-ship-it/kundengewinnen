<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Kundengewinnen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316a34a'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN -->
  <section id="login" class="login" hidden>
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="brand brand-lg"><span class="logo">✓</span> Kundengewinnen</div>
      <p class="muted">Bitte anmelden</p>
      <label>Name<input id="loginName" name="username" autocomplete="username" required></label>
      <label>Passwort<input id="loginPass" name="password" type="password" autocomplete="current-password" required></label>
      <p id="loginError" class="error" hidden>Name oder Passwort falsch.</p>
      <button class="btn btn-primary btn-block" type="submit">Anmelden</button>
    </form>
  </section>

  <!-- APP -->
  <div id="app" class="app" hidden>
    <nav class="sidebar">
      <div class="brand"><span class="logo">✓</span><span class="brand-text">Kundengewinnen</span></div>
      <div id="navLists" class="nav-lists"></div>
      <div class="nav-spacer"></div>
      <button class="nav-item nav-small" data-act="syncSetup"><span class="ico">☁</span><span class="nav-label">Abgleich (Handy/PC)</span></button>
      <button class="nav-item nav-small" data-act="backup"><span class="ico">⬇</span><span class="nav-label">Backup sichern</span></button>
      <button class="nav-item nav-small" data-act="restore"><span class="ico">⬆</span><span class="nav-label">Backup laden</span></button>
      <button class="nav-item nav-small" data-act="logout"><span class="ico">⎋</span><span class="nav-label">Abmelden</span></button>
    </nav>

    <main class="main">
      <div class="topbar"><button id="syncBadge" class="sync-badge" data-act="syncSetup" type="button">☁ Abgleich einrichten</button></div>
      <div id="dueBanner" class="due-banner" hidden></div>
      <div id="view"></div>
    </main>

    <aside id="drawer" class="drawer" hidden></aside>
    <div id="drawerShade" class="shade" hidden></div>
  </div>

  <div id="modal" class="modal" hidden></div>
  <div id="popover" class="popover" hidden></div>
  <div id="toasts" class="toasts"></div>

  <datalist id="cityOptions"></datalist>
  <input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
  <input type="file" id="fileJson" accept=".json,application/json" hidden>

  <script src="core.js"></script>
  <script src="views.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
